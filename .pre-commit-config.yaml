repos:
  # 1. Rust Standard Toolchain (Fmt & Clippy)
  - repo: local
    hooks:
      - id: cargo-clippy
        name: Cargo Clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
      - id: fmt
        name: Cargo Format Check
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        always_run: true

  # 2. Cargo Test
  - repo: local
    hooks:
      - id: cargo-test
        name: Cargo Test
        entry: cargo test --workspace --all-features
        language: system
        always_run: true
        pass_filenames: false

  # 3. Managed ripsecrets (v0.1.11)
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets
        args:
          - --strict-ignore
          - --additional-pattern
          - '(?:FURIOUS_SYNTHETIC_SECRET_[0-9A-F]{16})'